# Render Blueprint — FREE TIER version. Render's free plan only allows
# Web Service type (no free Background Worker) and free web services sleep
# after 15 min with no inbound HTTP traffic. So this runs the scheduler
# AND the Telegram bot in ONE process (scripts/run_combined.py) — one
# free web service, kept awake by an external pinger hitting /health.
#
# Trade-off, stated plainly: locally these are two separate processes so
# a bot crash never touches trading and vice versa. Combining them for
# the free tier gives that isolation up — real, not cosmetic.
#
# Setup after the first deploy:
#   1. Fill in the `sync: false` env vars in the Render dashboard.
#   2. Point an external uptime pinger (UptimeRobot, cron-job.org — both
#      have free tiers) at https://<service>.onrender.com/health every
#      ~10 minutes. Without this the service sleeps and NOTHING runs
#      until the next inbound request wakes it — there is no cron
#      firing while asleep.
#   3. The free Postgres plan EXPIRES 30 days after creation. Before then,
#      either upgrade it to a paid plan in the dashboard or export/restore
#      the data — it is not a permanent free tier.
#
# When billing is set up: switch to render.paid.yaml instead (two
# always-on services, no sleep, no 30-day database expiry).
databases:
  - name: quntra-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: quntra-combined
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/run_combined.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: POSTGRES_URL
        fromDatabase:
          name: quntra-db
          property: connectionString
      - key: PAPER_TRADE
        value: "true"
      - key: LIVE_TRADING
        value: "false"
      - key: DAILY_CAPITAL_INR
        value: "10000000"
      - key: MAX_TRADES_PER_DAY
        value: "3"
      - key: MIN_SIGNAL_SCORE
        value: "9"
      - key: ENABLE_SIGNAL_COUNCIL_TRADING
        value: "false"
      # Everything below is a real secret — set manually in the dashboard,
      # never committed. sync: false means Render will prompt for it.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ICICI_BREEZE_API_KEY
        sync: false
      - key: ICICI_BREEZE_API_SECRET
        sync: false
      - key: ICICI_BREEZE_SESSION_TOKEN
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
